# Same ports as run.bat. MySQL is only published on 3307 so it does not
# collide with a local Laragon MySQL already bound to 3306.
#   docker compose up --build
#   docker compose up --build express

x-db-wait: &db-wait
  depends_on:
    mysql:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: backend_starter
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./express/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/02-rails-schema-migrations.sql:/docker-entrypoint-initdb.d/02-rails-schema-migrations.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  express:
    <<: *db-wait
    build: ./express
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      API_BASE_URL: http://localhost:3000
      DB_DIALECT: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: backend_starter
      DB_USER: root
      DB_PASSWORD: secret
      DB_SYNC: "false"
      DB_SYNC_FORCE: "false"
      JWT_SECRET: change-me-to-a-long-random-string-at-least-32-chars

  rails:
    <<: *db-wait
    build: ./ruby-on-rails
    ports:
      - "3001:3001"
    environment:
      RAILS_ENV: development
      PORT: 3001
      SECRET_KEY_BASE: change-me-to-a-long-random-string-at-least-32-chars
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: backend_starter
      DB_USER: root
      DB_PASSWORD: secret
      JWT_SECRET: change-me-to-a-long-random-string-at-least-32-chars

  nest-js:
    <<: *db-wait
    build: ./nest-js
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_DIALECT: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: secret
      DB_NAME: backend_starter
      DB_SYNCHRONIZE: "false"
      DB_SEED: "false"
      JWT_SECRET: change-me-to-a-long-random-string-at-least-32-chars
      JWT_REFRESH_SECRET: change-me-to-another-long-random-string

  nest-ts:
    <<: *db-wait
    build: ./nest-ts
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: secret
      DB_DATABASE: backend_starter
      DB_SYNCHRONIZE: "false"
      DB_SEED: "false"
      JWT_SECRET: change-me-super-secret-access-token
      JWT_REFRESH_SECRET: change-me-super-secret-refresh-token

  flask:
    <<: *db-wait
    build: ./flask
    ports:
      - "5000:5000"
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      API_BASE_URL: http://localhost:5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: backend_starter
      DB_USER: root
      DB_PASSWORD: secret
      JWT_SECRET: change-me-to-a-long-random-string-at-least-32-chars

  dotnet:
    <<: *db-wait
    build: ./dotnet
    ports:
      - "5080:5080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5080
      Urls: http://0.0.0.0:5080
      ConnectionStrings__Default: Server=mysql;Port=3306;Database=backend_starter;User=root;Password=secret;
      Jwt__Secret: change-me-to-a-long-random-string-at-least-32-chars
      Seed__Enabled: "false"

  django:
    <<: *db-wait
    build: ./django
    ports:
      - "8000:8000"
    environment:
      DJANGO_ENV: development
      DJANGO_SECRET_KEY: change-me-to-a-long-random-string-at-least-32-chars
      DB_DIALECT: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: backend_starter
      DB_USER: root
      DB_PASSWORD: secret
      JWT_SECRET: change-me-to-a-long-random-string-at-least-32-chars

  laravel11:
    <<: *db-wait
    build: ./laravel11
    ports:
      - "8001:8001"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:bG9jYWwtZG9ja2VyLWFwcC1rZXktMzJieXRlcyEhISE=
      APP_URL: http://localhost:8001
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: backend_starter
      DB_USERNAME: root
      DB_PASSWORD: secret
      JWT_SECRET: change-me-to-a-long-random-string-at-least-32-chars

  springboot:
    <<: *db-wait
    build: ./springboot
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: backend_starter
      DB_USER: root
      DB_PASSWORD: secret
      APP_SEED: "false"
      JWT_SECRET: change-me-to-a-secret-at-least-32-chars

  ci4:
    <<: *db-wait
    build: ./ci4
    ports:
      - "8081:8081"
    environment:
      CI_ENVIRONMENT: development
      app.baseURL: http://localhost:8081/
      database.default.hostname: mysql
      database.default.database: backend_starter
      database.default.username: root
      database.default.password: secret
      database.default.DBDriver: MySQLi
      database.default.port: 3306
      JWT_SECRET: change-me-to-a-long-random-string-at-least-32-chars
      JWT_EXPIRES_IN: 3600
      JWT_REFRESH_EXPIRES_IN: 604800

volumes:
  mysql_data:
