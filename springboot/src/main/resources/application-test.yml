spring:
  datasource:
    url: jdbc:h2:mem:backend_starter;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/test-migration
  test:
    database:
      replace: none

app:
  seed: false
  bcrypt-rounds: 4
  jwt:
    secret: test-only-jwt-secret-key-32bytes!!
    access-secret: ""
    refresh-secret: ""
    expires-in: 3600
    refresh-expires-in: 604800
  # Global limiter never runs in tests so suites cannot flake (spec section 2).
  rate-limit:
    enabled: false
    window-ms: 60000
    max: 300
  # Existing per-endpoint limiter stays active but effectively unlimited in tests.
  auth-rate-limit:
    window-ms: 900000
    max: 100000
  # Pinned to the spec defaults so environment variables cannot break the suite.
  login-rate-limit:
    max: 3
    window-ms: 900000
    ip-max: 10
    ip-window-ms: 900000

logging:
  level:
    root: warn
