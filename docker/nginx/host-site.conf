# Copy to the host nginx, then replace example.com with the same DOMAIN
# used in the project .env file.
#
#   sudo cp docker/nginx/host-site.conf /etc/nginx/sites-available/backend.conf
#   sudo ln -sfn /etc/nginx/sites-available/backend.conf /etc/nginx/sites-enabled/backend.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name
        express.example.com
        rails.example.com
        nestjs.example.com
        nestts.example.com
        flask.example.com
        dotnet.example.com
        django.example.com
        laravel.example.com
        spring.example.com
        ci4.example.com
        go.example.com;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
